<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Transaction Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="text-center mb-0">Financial Transaction Analysis</h2>
                    </div>
                    <div class="card-body">
                        <div class="upload-section text-center mb-4">
                            <h4>Upload Your Transaction Data</h4>
                            <p class="text-muted">Upload a CSV file containing your financial transactions</p>
                            <form id="uploadForm" class="mt-3">
                                <div class="mb-3">
                                    <input type="file" class="form-control" id="fileInput" accept=".csv" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Analyze Transactions</button>
                                <button type="button" id="predictBtn" class="btn btn-success ms-2">Predict Expenses</button>
                            </form>
                        </div>

                        <div id="loading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Processing your data...</p>
                        </div>

                        <div id="error" class="alert alert-danger d-none" role="alert"></div>

                        <div id="prediction" class="d-none">
                            <div id="predictionResult"></div>
                        </div>

                        <div id="results" class="d-none">
                            <div class="row">
                                <!-- Summary Statistics -->
                                <div class="col-md-6 mb-4">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">Summary Statistics</h5>
                                        </div>
                                        <div class="card-body" id="summaryStats"></div>
                                    </div>
                                </div>

                                <!-- Time Patterns -->
                                <div class="col-md-6 mb-4">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">Time Patterns</h5>
                                        </div>
                                        <div class="card-body" id="timePatterns"></div>
                                    </div>
                                </div>

                                <!-- Monthly Summary -->
                                <div class="col-md-6 mb-4">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">Monthly Summary</h5>
                                        </div>
                                        <div class="card-body">
                                            <div id="monthlyStats" class="monthly-stats"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Client Summary -->
                                <div class="col-md-6 mb-4">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5 class="mb-0">Client Summary</h5>
                                        </div>
                                        <div class="card-body" id="clientStats"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
